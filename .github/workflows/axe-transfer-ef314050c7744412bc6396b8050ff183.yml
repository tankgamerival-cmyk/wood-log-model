name: Transfer verified axe ef314050c7744412bc6396b8050ff183
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axe-transfer-ef314050c7744412bc6396b8050ff183.yml'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verify and commit axe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 'https://tmpfiles.org/dl/1794925085.6f98a17d48d5b1d8/wlAEtNow5c43/rusty_survival_axe.glb' -o /tmp/toqi-axe.glb
          echo '6c7d262d5dc4476d0b53daf3885dbb5052bd1a11ac3436ddcadcf6e12c9233ac  /tmp/toqi-axe.glb' | sha256sum -c -
          test "$(wc -c < /tmp/toqi-axe.glb)" -eq 6666164
          git fetch origin main
          if git cat-file -e origin/main:rusty_survival_axe.glb 2>/dev/null || test -e rusty_survival_axe.glb; then
            echo 'Destination occupied, refusing overwrite'; exit 1
          fi
          cp /tmp/toqi-axe.glb rusty_survival_axe.glb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rusty_survival_axe.glb
          git commit -m 'Add verified rusty survival axe model'
          git push origin HEAD:refs/heads/main
