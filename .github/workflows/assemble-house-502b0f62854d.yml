name: Assemble abandoned house 502b0f62854d
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-house-502b0f62854d.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        run: |
          test ! -e abandoned_house.gltf
          python3 -c 'import base64,hashlib,json,pathlib; files=sorted(pathlib.Path('"'"'house_upload_chunks_502b0f62854d'"'"').glob('"'"'*.b64'"'"')); assert len(files)==66, '"'"'wrong number of chunks'"'"'; data=base64.b64decode('"'"''"'"'.join(p.read_text() for p in files),validate=True); assert hashlib.sha256(data).hexdigest()=='"'"'a78369b447d5f1ab7640b7bd4e8f2f95cb3036e676da8e596f265fcb2da5f135'"'"', '"'"'SHA256 mismatch'"'"'; json.loads(data); pathlib.Path('"'"'abandoned_house.gltf'"'"').write_bytes(data); print('"'"'SHA256 verified: a78369b447d5f1ab7640b7bd4e8f2f95cb3036e676da8e596f265fcb2da5f135'"'"')'
      - name: Commit model and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abandoned_house.gltf
          git rm -r -- 'house_upload_chunks_502b0f62854d' '.github/workflows/assemble-house-502b0f62854d.yml'
          git commit -m 'Add verified abandoned house model'
          git push origin HEAD:main
