name: Publish improved leaves tree
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-improved-tree-cbdd7962bc26.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and publish unchanged model
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git cat-file -e origin/main:realistic_tree_improved_leaves.glb 2>/dev/null || test -e realistic_tree_improved_leaves.glb; then
            echo 'Destination exists; refusing overwrite' >&2
            exit 1
          fi
          curl --fail --location --retry 3 --max-time 120 'https://tmpfiles.org/dl/1794924282.a1b6a0c1c5a10a8e/wPADtkdKplNY/realistic_tree_improved_leaves.glb' -o realistic_tree_improved_leaves.glb
          echo 'd49bb9ea7ffe9d2104c1f17e2426cc1e905221ceb35545e9fbdebfc5ae028846  realistic_tree_improved_leaves.glb' | sha256sum --check
          test "$(wc -c < realistic_tree_improved_leaves.glb)" -eq 3739056
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- realistic_tree_improved_leaves.glb
          git commit -m 'Add verified improved leaves tree model'
          git push origin HEAD:refs/heads/main
